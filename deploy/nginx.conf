server {
    listen 80;
    server_name _;
    root /srv/gfs;
    index index.html;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /status.json { try_files $uri =404; }
    location = /latest.json { try_files $uri =404; }
    location /runs/ { try_files $uri $uri/ =404; }
    location / { return 404; }
}
